name: iOS

# The native port's parity tests: the Swift package against the prototype's
# golden cases in spec/. Runs only when either side changes.
on:
  push:
    branches: [main, dev]
    paths: ["ios/**", "spec/**", "prototype/src/model/book/book.json", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "spec/**", "prototype/src/model/book/book.json", ".github/workflows/ios.yml"]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test -c release -Xswiftc -enable-testing --filter EngineBenchTests
        working-directory: ios
        env:
          ENGINE_BENCH: "1"
      - run: swift test
        working-directory: ios

  # The app itself, which swift test does not build.
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - run: >-
          xcodebuild build -project ChessPlaybook.xcodeproj -scheme ChessPlaybookApp
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
        working-directory: ios
