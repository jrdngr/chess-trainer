name: ChessPlaybook
options:
  bundleIdPrefix: com.jordangrace
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  ChessPlaybook:
    path: .
targets:
  ChessPlaybookApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources/book.json
        buildPhase: resources
    dependencies:
      - package: ChessPlaybook
        product: Model
      - package: ChessPlaybook
        product: Engine
      - package: ChessPlaybook
        product: Shared
    settings:
      base:
        PRODUCT_NAME: Chess Playbook
        PRODUCT_BUNDLE_IDENTIFIER: com.jordangrace.chessplaybook
        DEVELOPMENT_TEAM: 94BFKA4Q2U
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Playbook
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Support/ChessPlaybook.entitlements
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  ChessPlaybookApp:
    build:
      targets:
        ChessPlaybookApp: all
    run:
      config: Debug
    archive:
      config: Release
