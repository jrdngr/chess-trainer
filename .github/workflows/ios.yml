name: iOS

# The Swift package's tests, and a build of the app.
on:
  push:
    branches: [main, dev]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test -c release -Xswiftc -enable-testing --filter EngineBenchTests
        working-directory: ios
        env:
          ENGINE_BENCH: "1"
      - run: swift test
        if: always()
        working-directory: ios

  # The app itself, which swift test does not build.
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - run: >-
          xcodebuild build -project ChessPlaybook.xcodeproj -scheme ChessPlaybookApp
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
        working-directory: ios
